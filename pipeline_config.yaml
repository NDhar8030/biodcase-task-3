data_preprocessing:
  audio_slice_duration_ms: 2000
  sample_rate: 16000
feature_extraction:
  window_len: 512
  window_stride: 384
  window_scaling_bits: 12
  mel_n_channels: 32
  mel_low_hz: 2000
  mel_high_hz: 7500
  mel_post_scaling_bits: 6
model_training:
  seed: 42
  n_epochs: 20
  shuffle_buff_n: 10000
  batch_size: 32
  early_stopping:
    patience: 3 # I don't actually use early stopping
embedded_code_generation:
  serial_device: "/dev/ttyUSB0" # Replace with your serial device